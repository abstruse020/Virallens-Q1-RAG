[project]
name = "pdf-rag-agent"
version = "0.1.0"
description = "RAG agent over local PDFs using deepagents"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.21",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
pdf-rag = "pdf_rag_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_rag_agent"]

[dependency-groups]
dev = []
